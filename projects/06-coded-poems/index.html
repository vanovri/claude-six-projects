    // Charcoal / Graphite Pencil Textured Typography Renderer (matching frame_07.jpg)
    function drawCharcoalText(ctx, lines, cx, startY, inkColor, scale = 1.0) {
      ctx.save();
      ctx.font = `italic 600 ${Math.round(31 * scale)}px "Georgia", "Palatino Linotype", serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = inkColor;

      lines.forEach((line, idx) => {
        const y = startY + idx * (44 * scale);
        // Multi-pass jittered rendering for authentic grainy charcoal/crayon texture
        for (let pass = 0; pass < 5; pass++) {
          const jx = Math.sin(pass * 2.1 + idx) * 0.75;
          const jy = Math.cos(pass * 1.7 + idx) * 0.65;
          ctx.globalAlpha = pass === 0 ? 0.72 : 0.24;
          ctx.fillText(line, cx + jx, y + jy);
        }
      });
      ctx.restore();
    }

    // Pencil line helper
    function drawSketchLine(ctx, x1, y1, x2, y2, color, width = 1.4, wobble = 1.2) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const segs = 12;
      for (let i = 1; i <= segs; i++) {
        const u = i / segs;
        const ox = Math.sin(u * Math.PI * 3 + x1 * 0.05) * wobble;
        const oy = Math.cos(u * Math.PI * 2 + y1 * 0.05) * wobble;
        ctx.lineTo(x1 + (x2 - x1) * u + ox, y1 + (y2 - y1) * u + oy);
      }
      ctx.stroke();
      ctx.restore();
    }

    // Render any poem's procedural animation onto a given 2D context
    function renderPoemFrame(ctx, poem, W, H, t, pointerX = 0.5, pointerY = 0.5, scale = 1.0) {
      ctx.fillStyle = poem.bg;
      ctx.fillRect(0, 0, W, H);

      const cx = W * 0.5;
      const windSway = Math.sin(t * 1.4) * 6 + (pointerX - 0.5) * 18;

      if (poem.mode === 'espalier') {
        // HAIKU #1 (matches frame_07.jpg verbatim!): Horizontal trellis wires + fan-trained pear shoots & buds
        const wireStartY = H * 0.44;
        const wireGap = H * 0.088;
        ctx.strokeStyle = 'rgba(130, 125, 110, 0.32)';
        ctx.lineWidth = 1;
        for (let w = 0; w < 6; w++) {
          const wy = wireStartY + w * wireGap;
          ctx.beginPath();
          ctx.moveTo(0, wy);
          ctx.lineTo(W, wy);
          ctx.stroke();
        }

        // 9 radiating fan-trained shoots from bottom center
        const angles = [-0.56, -0.42, -0.28, -0.14, 0, 0.14, 0.28, 0.42, 0.56];
        const baseX = W * 0.52;
        const baseY = H + 15;
        const shootLen = H * 0.60;

        angles.forEach((ang, i) => {
          const sway = windSway * 0.008 * (1 + Math.abs(ang));
          const tipX = baseX + Math.sin(ang + sway) * shootLen;
          const tipY = baseY - Math.cos(ang + sway) * shootLen;

          drawSketchLine(ctx, baseX + (i - 4) * 3, baseY, tipX, tipY, '#6e6a5e', 1.6, 1.1);

          // Closed blossom buds & wire ties along each shoot
          [0.35, 0.58, 0.78, 0.96].forEach((u, bIdx) => {
            const bx = (baseX + (i - 4) * 3) * (1 - u) + tipX * u;
            const by = baseY * (1 - u) + tipY * u;
            const side = (bIdx % 2 === 0 ? 1 : -1) * 4;
            ctx.fillStyle = 'rgba(95, 92, 82, 0.68)';
            ctx.beginPath();
            ctx.arc(bx + side, by, 3.5 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(70, 67, 58, 0.85)';
            ctx.lineWidth = 1;
            ctx.stroke();
          });
        });
      } else if (poem.mode === 'spiderweb') {
        // HAIKU #2 (matches frame_07_b.jpg verbatim!): Radial orb web in top-left + sweeping silk anchor thread
        const webCx = W * 0.26;
        const webCy = H * 0.23;
        const maxR = W * 0.44;
        const spokes = 18;

        ctx.strokeStyle = '#262012';
        ctx.lineWidth = 1.25;

        // Radial spokes
        for (let s = 0; s < spokes; s++) {
          const ang = (s / spokes) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(webCx, webCy);
          ctx.lineTo(webCx + Math.cos(ang) * maxR, webCy + Math.sin(ang) * maxR);
          ctx.stroke();
        }

        // Concentric spiral silk rings
        for (let ring = 1; ring <= 14; ring++) {
          const r = (ring / 14) * maxR * 0.92;
          ctx.beginPath();
          for (let s = 0; s <= spokes; s++) {
            const ang = (s / spokes) * Math.PI * 2;
            const sag = Math.sin(s * 1.7 + t * 2) * 1.2;
            const px = webCx + Math.cos(ang) * (r + sag);
            const py = webCy + Math.sin(ang) * (r + sag);
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        // Long sweeping anchor thread to the right with sliding dew beads
        ctx.beginPath();
        ctx.moveTo(webCx + maxR * 0.92, webCy);
        ctx.quadraticCurveTo(W * 0.72, H * 0.04 + windSway, W + 10, H * 0.14);
        ctx.lineWidth = 1.6;
        ctx.stroke();

        // Dew beads along the anchor thread
        [0.22, 0.48, 0.74].forEach((u, idx) => {
          const slideU = (u + (t * 0.08) % 0.25);
          const x0 = webCx + maxR * 0.92, y0 = webCy;
          const x1 = W * 0.72, y1 = H * 0.04 + windSway;
          const x2 = W + 10, y2 = H * 0.14;
          const dx = (1 - slideU) ** 2 * x0 + 2 * (1 - slideU) * slideU * x1 + slideU ** 2 * x2;
          const dy = (1 - slideU) ** 2 * y0 + 2 * (1 - slideU) * slideU * y1 + slideU ** 2 * y2;
          ctx.fillStyle = '#262012';
          ctx.beginPath();
          ctx.arc(dx, dy, 3.2 * scale, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (poem.mode === 'inkdrop') {
        // HAIKU #3 (matches frame_07_c.jpg verbatim!): Concentric feathered chromatography ink rings
        const icx = W * 0.48;
        const icy = H * 0.20;

        // Center dark indigo ink core
        ctx.fillStyle = '#1f3b6e';
        ctx.beginPath();
        ctx.arc(icx, icy, 34 * scale, 0, Math.PI * 2);
        ctx.fill();

        const ringSpecs = [
          { r: 52, col: 'rgba(196, 148, 45, 0.65)', amp: 8, freq: 24 },
          { r: 74, col: 'rgba(26, 62, 122, 0.75)', amp: 11, freq: 28 },
          { r: 98, col: 'rgba(178, 58, 48, 0.68)', amp: 13, freq: 22 },
          { r: 124, col: 'rgba(204, 156, 52, 0.62)', amp: 15, freq: 26 },
          { r: 152, col: 'rgba(116, 169, 207, 0.48)', amp: 14, freq: 30 },
          { r: 182, col: 'rgba(222, 206, 165, 0.55)', amp: 16, freq: 32 }
        ];

        ringSpecs.forEach((rs, idx) => {
          const breathe = 1 + 0.04 * Math.sin(t * 1.5 - idx * 0.5);
          const baseR = rs.r * scale * breathe;
          ctx.strokeStyle = rs.col;
          ctx.lineWidth = 5.5 * scale;
          ctx.lineJoin = 'round';
          ctx.beginPath();
          const steps = 120;
          for (let i = 0; i <= steps; i++) {
            const ang = (i / steps) * Math.PI * 2;
            const zig = Math.sin(ang * rs.freq + t * 0.8 + idx) * rs.amp * scale;
            const px = icx + Math.cos(ang) * (baseR + zig);
            const py = icy + Math.sin(ang) * (baseR + zig);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
        });

        // 3 wet satellite ink drops on the rim (matching frame_07_c.jpg!)
        [
          { ang: 0.55, r: 130, col: '#1b2a38' },
          { ang: 1.35, r: 145, col: '#1f6f54' },
          { ang: 2.45, r: 138, col: '#9e2a2b' }
        ].forEach(d => {
          const dx = icx + Math.cos(d.ang) * d.r * scale;
          const dy = icy + Math.sin(d.ang) * d.r * scale;
          ctx.fillStyle = d.col;
          ctx.beginPath();
          ctx.arc(dx, dy, 8.5 * scale, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (poem.mode === 'ripples') {
        // Concentric water rings + vertical reed stalks
        const rcx = W * 0.5, rcy = H * 0.66;
        for (let r = 0; r < 6; r++) {
          const prog = ((t * 0.35 + r / 6) % 1);
          ctx.strokeStyle = `rgba(47, 61, 59, ${(1 - prog) * 0.55})`;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(rcx, rcy, prog * W * 0.44, prog * H * 0.18, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        [-90, -55, 65, 95, 115].forEach((ox, i) => {
          drawSketchLine(ctx, rcx + ox * scale, H, rcx + (ox + windSway) * scale, H * 0.42 + i * 12, '#2f3d3b', 2.0, 0.8);
        });
      } else if (poem.mode === 'bamboo') {
        // Jointed bamboo stalks bending in snow
        [-0.22, 0, 0.24].forEach((offset, idx) => {
          const bx = W * (0.5 + offset);
          let curX = bx, curY = H * 0.55;
          for (let seg = 0; seg < 4; seg++) {
            const nextX = curX + (windSway * 0.35 + (seg + 1) * 5 * (idx - 0.5)) * scale;
            const nextY = curY - 58 * scale;
            drawSketchLine(ctx, curX, curY, nextX, nextY, '#354a34', (5 - seg * 0.7) * scale, 0.5);
            // Node ring
            ctx.strokeStyle = '#1f2d1e';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(nextX - 6, nextY);
            ctx.lineTo(nextX + 6, nextY);
            ctx.stroke();
            curX = nextX;
            curY = nextY;
          }
        });
      } else if (poem.mode === 'fireflies') {
        // Glowing golden fireflies rising through dark sedge grass
        for (let i = 0; i < 24; i++) {
          const fx = ((Math.sin(i * 7.3 + t * 0.4) * 0.42 + 0.5) * W);
          const fy = H * 0.42 + ((Math.cos(i * 4.1 - t * 0.35) * 0.25 + 0.3) * H);
          const pulse = 0.35 + 0.65 * Math.pow(Math.sin(t * 2.5 + i * 1.9), 2);
          ctx.fillStyle = `rgba(250, 218, 94, ${pulse})`;
          ctx.beginPath();
          ctx.arc(fx, fy, (3 + pulse * 3) * scale, 0, Math.PI * 2);
          ctx.fill();
        }
        for (let g = 0; g < 18; g++) {
          const gx = (g / 17) * W;
          drawSketchLine(ctx, gx, H, gx + windSway * 1.4, H * 0.62 + (g % 4) * 18, 'rgba(180,195,175,0.35)', 1.5, 0.8);
        }
      } else {
        // Rich procedural nature geometries tailored to each poem (#7 - #20)
        const seed = poem.id;
        const centerY = poem.textPos === 'top' ? H * 0.68 : H * 0.30;
        ctx.save();
        ctx.translate(cx, centerY);

        if (poem.mode === 'sandwaves' || poem.mode === 'zenstone' || poem.mode === 'mountains') {
          for (let line = -5; line <= 5; line++) {
            ctx.beginPath();
            for (let x = -W * 0.42; x <= W * 0.42; x += 8) {
              const wave = Math.sin(x * 0.03 + t * 1.4 + line * 0.6) * (12 + seed % 8) * scale;
              const py = line * 18 * scale + wave;
              if (x === -W * 0.42) ctx.moveTo(x, py);
              else ctx.lineTo(x, py);
            }
            ctx.strokeStyle = poem.ink;
            ctx.globalAlpha = 0.45;
            ctx.lineWidth = 1.8 * scale;
            ctx.stroke();
          }
        } else {
          // Radial botanical / celestial mandala motion for dandelion, frost, petals, startrails, cicada, etc.
          const rays = 16 + (seed % 12);
          const maxRadius = 115 * scale;
          for (let r = 0; r < rays; r++) {
            const ang = (r / rays) * Math.PI * 2 + t * 0.18;
            const len = maxRadius * (0.65 + 0.35 * Math.sin(r * 2.3 + t * 1.4));
            const x2 = Math.cos(ang) * len;
            const y2 = Math.sin(ang) * len;
            drawSketchLine(ctx, 0, 0, x2, y2, poem.ink, 1.3 * scale, 0.9);
            ctx.fillStyle = poem.ink;
            ctx.globalAlpha = 0.65;
            ctx.beginPath();
            ctx.arc(x2, y2, 3.2 * scale, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      // Render the 3-line Haiku Poem in textured charcoal handwriting
      const textStartY = poem.textPos === 'top' ? H * 0.16 : H * 0.66;
      drawCharcoalText(ctx, poem.lines, cx, textStartY, poem.ink, scale);
    }

    // State & Stage Controls
    let activePoemIdx = 0;
    let viewMode = 'stage'; // 'stage' | 'grid'
    let autoCycle = false;
    let pointer = { x: 0.5, y: 0.5 };

    const stageCanvas = document.getElementById('stageCanvas');
    const stageCtx = stageCanvas.getContext('2d');
    const numberStrip = document.getElementById('poemNumberStrip');
    const galleryGrid = document.getElementById('galleryGrid');
    const miniContexts = [];

    function selectPoem(idx) {
      activePoemIdx = (idx + POEMS.length) % POEMS.length;
      const p = POEMS[activePoemIdx];
      document.getElementById('poemCounterLabel').textContent =
        `Haiku ${String(p.id).padStart(2, '0')} / 20 — ${p.title}`;
      document.querySelectorAll('.num-dot').forEach((d, i) => {
        d.classList.toggle('active', i === activePoemIdx);
      });
    }

    // Build 1..20 selector dots & 20 gallery cards
    POEMS.forEach((p, idx) => {
      const dot = document.createElement('button');
      dot.className = 'num-dot' + (idx === 0 ? ' active' : '');
      dot.textContent = p.id;
      dot.title = p.title;
      dot.addEventListener('click', () => selectPoem(idx));
      numberStrip.appendChild(dot);

      const card = document.createElement('div');
      card.className = 'mini-poem-card';
      const mc = document.createElement('canvas');
      mc.className = 'mini-canvas';
      mc.width = 290;
      mc.height = 350;
      card.appendChild(mc);
      card.addEventListener('click', () => {
        selectPoem(idx);
        setViewMode('stage');
      });
      galleryGrid.appendChild(card);
      miniContexts.push({ ctx: mc.getContext('2d'), poem: p, w: 290, h: 350 });
    });

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('featuredWrap').style.display = mode === 'stage' ? 'flex' : 'none';
      galleryGrid.classList.toggle('active', mode === 'grid');
      document.getElementById('btnViewStage').classList.toggle('active', mode === 'stage');
      document.getElementById('btnViewGrid').classList.toggle('active', mode === 'grid');
    }

    document.getElementById('btnViewStage').addEventListener('click', () => setViewMode('stage'));
    document.getElementById('btnViewGrid').addEventListener('click', () => setViewMode('grid'));
    document.getElementById('btnPrevPoem').addEventListener('click', () => selectPoem(activePoemIdx - 1));
    document.getElementById('btnNextPoem').addEventListener('click', () => selectPoem(activePoemIdx + 1));

    stageCanvas.addEventListener('mousemove', e => {
      const r = stageCanvas.getBoundingClientRect();
      pointer.x = (e.clientX - r.left) / r.width;
      pointer.y = (e.clientY - r.top) / r.height;
    });

    stageCanvas.addEventListener('click', () => {
      selectPoem(activePoemIdx + 1);
    });

    let cycleTimer = null;
    document.getElementById('btnAutoCycle').addEventListener('click', e => {
      autoCycle = !autoCycle;
      e.target.textContent = `Auto-Cycle: ${autoCycle ? 'On (4s)' : 'Off'}`;
      e.target.classList.toggle('active', autoCycle);
      if (cycleTimer) clearInterval(cycleTimer);
      if (autoCycle) {
        cycleTimer = setInterval(() => selectPoem(activePoemIdx + 1), 4000);
      }
    });

    let startTime = performance.now();
    function tickPoems(now) {
      const t = (now - startTime) * 0.001;
      if (viewMode === 'stage') {
        renderPoemFrame(stageCtx, POEMS[activePoemIdx], 520, 610, t, pointer.x, pointer.y, 1.0);
      } else {
        miniContexts.forEach(item => {
          renderPoemFrame(item.ctx, item.poem, item.w, item.h, t, 0.5, 0.5, 0.56);
        });
      }
      requestAnimationFrame(tickPoems);
    }
    requestAnimationFrame(tickPoems);
  </script>
</body>
</html>
